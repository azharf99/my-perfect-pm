name: CI/CD Pipeline & Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  test-and-lint:
    name: Test & Lint (Go & React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./web
        run: npm ci

      - name: Build Frontend & Typecheck
        working-directory: ./web
        run: npm run build

      - name: Copy Frontend Assets for Embed
        run: |
          mkdir -p cmd/server/dist
          cp -r web/dist/* cmd/server/dist/

      - name: Run Backend Unit Tests
        run: go test -v ./...

      - name: Run govulncheck (Go Vulnerability Scanner)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  trivy-fs-scan:
    name: Trivy Filesystem Security Scan
    runs-on: ubuntu-latest
    needs: [test-and-lint]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner (FS)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  build-and-deploy:
    name: Build Image and Deploy to VPS
    needs: trivy-fs-scan
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    if: github.ref == 'refs/heads/main' # Hanya jalankan saat push ke main

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. Login ke Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 2. Build Docker Image dan Push ke Docker Hub
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        # Format penamaan di Docker Hub: username_dockerhub/nama_image:tag
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-perfect-pm:latest

    # 3. Copy file docker-compose.yml ke VPS menggunakan SCP
    - name: Copy docker-compose.yml to VPS via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        timeout: 30s
        source: "docker-compose.yml" # File yang ingin dikirim
        target: "/opt/my-perfect-pm"    

    # 4. SSH ke VPS untuk eksekusi Pull & Restart
    - name: Deploy to VPS via SSH
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        timeout: 30s
        command_timeout: 10m
        script: |
          cd /opt/my-perfect-pm
          
          # Tarik image terbaru dari Docker Hub
          docker compose pull
          
          # Eksekusi docker compose
          docker compose up -d
          
          # Bersihkan image yang tidak terpakai
          docker image prune -f