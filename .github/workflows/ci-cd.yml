name: CI/CD Pipeline & Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  test-and-lint:
    name: Test & Lint (Go & React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./web
        run: npm ci

      - name: Build Frontend & Typecheck
        working-directory: ./web
        run: npm run build

      - name: Copy Frontend Assets for Embed
        run: |
          mkdir -p cmd/server/dist
          cp -r web/dist/* cmd/server/dist/

      - name: Run Backend Unit Tests
        run: go test -v ./...

      - name: Run govulncheck (Go Vulnerability Scanner)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  trivy-fs-scan:
    name: Trivy Filesystem Security Scan
    runs-on: ubuntu-latest
    needs: [test-and-lint]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner (FS)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

