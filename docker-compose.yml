services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: azharfa/my-perfect-pm:latest
    container_name: my-perfect-pm
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
        reservations:
          memory: 32M
